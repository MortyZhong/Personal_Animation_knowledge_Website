direction":"out"},{"node":"round-03","label":"Can AI read API documentation and write integrations itself? Why use MCP to speed understanding?","relation":"explores","direction":"in"},{"node":"round-05","label":"Why not give the model a detailed tool definition explaining how to call an API?","relation":"explores","direction":"in"},{"node":"round-14","label":"Why would a REST client need to know a custom `/call_aws` endpoint? Couldn't its description tell the model what to call?","relation":"explores","direction":"in"},{"node":"concept-docs","label":"API documentation","relation":"informs","direction":"in"}]},"concept-focused":{"summary":"A smaller, relevant tool surface that can save integration effort and model context in suitable cases.","relations":[{"node":"concept-context","label":"Model context budget","relation":"may reduce","direction":"out"},{"node":"round-03","label":"Can AI read API documentation and write integrations itself? Why use MCP to speed understanding?","relation":"explores","direction":"in"},{"node":"round-05","label":"Why not give the model a detailed tool definition explaining how to call an API?","relation":"explores","direction":"in"},{"node":"concept-server","label":"MCP server","relation":"can expose","direction":"in"}]},"round-01":{"summary":"An AI agent can use ordinary tool definitions without MCP. MCP provides a shared way for applications to discover and call tools supplied by external servers. The application's MCP client communicates with the server; the model selects a tool from the description it receives. An MCP server may call an existing API. MCP makes an integration reusable across applications, but it does not itself guarantee correct or safe tool use.","question":"MCP client-server\u8ddf\u4f20\u7edf\u7684api\u6216\u8005tool\u6216\u8005function\u5230\u5e95\u6709\u4ec0\u4e48\u533a\u522b\uff0c\u4e3a\u4ec0\u4e48\u8981\u5355\u72ec\u5b9a\u4e49\u4e00\u4e2a\u534f\u8bae\u53bb\u5305\u88c5\u53ef\u8c03\u7528\u7684\u5de5\u5177\u7ed9ai\u5e94\u7528\uff0c\u4eba\u770b\u5230tool\u6587\u6863\u7136\u540e\u8c03\u7528tool\u8ddfai\u6709\u533a\u522b\u5417\uff0c\u4e0d\u90fd\u662f\u7ed9\u63a5\u53e3\u8bf4\u660e\u8f93\u5165\u8f93\u51fa\u5c31\u597d\u4e86\u5417","references":["https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"},{"node":"concept-api","label":"API","relation":"explores","direction":"out"},{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"}]},"round-02":{"summary":"Earlier standards already addressed parts of this problem. SOAP, WSDL, and UDDI covered service messaging, description, and discovery; OpenAPI describes HTTP APIs in a machine-readable form. MCP focuses on a shared interface between AI applications and tool providers while leaving underlying APIs in place. Its usefulness depends on adoption. Automatic service discovery existed before AI agents and is not unique to MCP.","question":"\u90a3\u4e3a\u4ec0\u4e48\u5728ai\u4e4b\u524d\u6ca1\u6709\u4eba\u7edf\u4e00\u8fd9\u79cdapi\u8c03\u7528\u7684\u6846\u67b6","references":["https://www.w3.org/TR/ws-arch/","https://spec.openapis.org/oas/latest.html"],"relations":[{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"},{"node":"concept-api","label":"API","relation":"explores","direction":"out"},{"node":"concept-docs","label":"API documentation","relation":"explores","direction":"out"}]},"round-03":{"summary":"A capable coding agent can integrate an API without MCP, and can save that adapter for reuse. An existing MCP server moves much of that integration work into a reusable component. It can also give the model a smaller, focused tool interface, which may help models with limited context or weaker API-integration ability. This benefit depends on clear, narrow tools; a large tool list can still consume context. Authentication, permission checks, and error handling remain necessary.","question":"\u4f20\u7edf\u8f6f\u4ef6\u5f00\u53d1\u5e94\u7528\u5916\u90e8api\u65f6\u5f00\u53d1\u8005\u9700\u8981\u81ea\u5df1\u53bb\u5bf9\u5e94\u7f51\u7ad9\u8bfb\u6587\u6863\u7136\u540e\u5199\u7a0b\u5e8f\uff0cai\u4e0d\u80fd\u4e5f\u8fd9\u4e48\u505a\u5417\uff0c\u4e3a\u4ec0\u4e48\u8981mcp\u6765\u52a0\u901f\u7406\u89e3","references":["https://spec.openapis.org/oas/latest.html","https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-direct","label":"Direct API integration","relation":"explores","direction":"out"},{"node":"concept-adapter","label":"API adapter","relation":"explores","direction":"out"},{"node":"concept-focused","label":"Focused tool interface","relation":"explores","direction":"out"},{"node":"concept-context","label":"Model context budget","relation":"explores","direction":"out"}]},"round-04":{"summary":"An input/output schema says what a call expects and returns, but a remote call also needs executable details such as endpoint, HTTP method, authentication, and response mapping. An adapter translates between interfaces. For example, an MCP tool call get_user(user_id=123) can be translated inside the MCP server into GET /api/users/123 with an authorization header. The API service performs the actual user lookup; the adapter does not implement that business logic. If a callable SDK already handles this translation, an extra adapter may be unnecessary.","question":"\u8fd9\u91cc\u7684adapter\u80fd\u4e3e\u4e2a\u4f8b\u5b50\u5417\uff0c\u6ca1\u641e\u61c2\u96c6\u6210\u7684\u542b\u4e49\uff0c\u4f5c\u4e3a\u5ba2\u6237\u7aef\u4e0d\u662f\u53ea\u9700\u8981\u77e5\u9053\u8f93\u5165\u548c\u8f93\u51fa\u5c31\u597d\u4e86\u5417\uff0c\u8ddf\u5ba2\u6237\u7aef\u7684\u5546\u4e1a\u903b\u8f91\u6709\u4ec0\u4e48\u5173\u7cfb","references":["https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-adapter","label":"API adapter","relation":"explores","direction":"out"},{"node":"concept-api","label":"API","relation":"explores","direction":"out"}]},"round-05":{"summary":"This can work if the agent has an actual HTTP execution tool. API documentation or a prompt alone cannot send a request. With a general HTTP tool, the model can select the endpoint, method, and parameters from documentation; this gives flexibility but places more request-construction and context burden on the model and the executor. A narrow tool can encapsulate those details and offer a simpler interface. An MCP server can expose either a narrow tool or a general HTTP tool, so these approaches can be combined. Secrets and permission checks belong in the execution layer, not in the model's visible tool description.","question":"\u4e3a\u4ec0\u4e48\u6211\u4e0d\u80fd\u7ed9\u6a21\u578b\u5de5\u5177\u5b9a\u4e49\u7684\u65f6\u5019\u8be6\u7ec6\u8bf4\u660e\u8be5\u600e\u4e48\u8c03\u7528\u8fd9\u4e2aapi\u5462","references":["https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-direct","label":"Direct API integration","relation":"explores","direction":"out"},{"node":"concept-focused","label":"Focused tool interface","relation":"explores","direction":"out"}]},"round-06":{"summary":"The analogy is useful, but MCP normally is a machine-readable protocol rather than a visual website. The host's MCP client discovers tool definitions (like viewing available controls), the model chooses a tool and supplies arguments (like filling a form), and the client calls the server (like submitting it). The server returns a result. The model does not literally click buttons, and the server can wrap an existing API. MCP standardizes the interaction pattern, while each tool still has its own meaning and parameters.","question":"\u6240\u4ee5mcp\u6709\u70b9\u50cf\u628a\u5de5\u5177\u6216\u8005api\u5c01\u88c5\u6210\u4e86\u4e00\u4e2a\u9762\u5411ai\u7684\u53ef\u89c6\u5316\u64cd\u4f5c\u7f51\u7ad9\uff0cai\u53ea\u9700\u8981\u70b9\u51fb\u67d0\u4e9b\u6309\u94ae\u8f93\u5165\u53c2\u6570\u5c31\u80fd\u5f97\u5230\u8f93\u51fa\uff1f","references":["https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"}]},"round-07":{"summary":"For an S3 bucket-listing task, a Python application can call boto3's list_buckets, while an agent can call the legacy AWS API MCP Server's call_aws tool with the AWS CLI-style command `aws s3api list-buckets`. In both cases the underlying AWS S3 service performs the operation. The MCP route adds a standard tool discovery/call interface and a reusable server that handles AWS integration and policy checks. This particular tool is broad, so the model may still need AWS CLI command knowledge; suggest_aws_commands can help. The repository's AWS API MCP Server is now a legacy example, with AWS recommending its managed successor.","question":"[https://github.com/awslabs/mcp](https://github.com/awslabs/mcp)\u4ee5\u8fd9\u4e2aMCP\u4e3a\u4f8b\uff0c\u5206\u6790\u4f20\u7edf\u8c03\u7528aws api\u548cai \u901a\u8fc7mcp\u8c03\u7528\u7684\u533a\u522b","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/README.md","https://github.com/awslabs/mcp/issues/4115","https://docs.aws.amazon.com/cli/latest/reference/s3api/list-buckets.html"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-aws_cli","label":"AWS CLI","relation":"explores","direction":"out"},{"node":"concept-aws_sdk","label":"AWS SDK","relation":"explores","direction":"out"}]},"round-08":{"summary":"From the AI host's code, an MCP tool can look like a function call such as call_tool(name, arguments). The MCP client still sends a protocol request to a server, and the server executes the tool, possibly calling an external API. This is function-like at the caller, not literally a local function: transport, permissions, latency, and errors remain. AWS SDKs already present remote AWS operations as local methods; MCP's additional role is a common discovery and call interface across tool providers and AI hosts.","question":"\u6240\u4ee5\u66f4\u50cf\u662f\u628aapi\u5f53\u6210\u4e86\u672c\u5730\u53ef\u4ee5\u76f4\u63a5call\u7684\u51fd\u6570\uff1f","references":["https://ts.sdk.modelcontextprotocol.io/v2/get-started/first-client.html"],"relations":[{"node":"concept-tool_call","label":"Tool call","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"}]},"round-09":{"summary":"A written AWS adapter can be reused by many agents, especially when they share a runtime or framework. The distinction is between the adapter that talks to AWS and each agent application's code for registering, describing, invoking, and returning results from that adapter. Different agent hosts may use different languages or tool interfaces even when they use the same LLM. MCP standardizes that host-to-tool boundary so an MCP-capable host can connect to a compatible server. Shared libraries, REST, gRPC, or a common tool registry can also provide reuse; MCP is a common interoperability contract rather than the only way to share code.","question":"`s3.list_buckets()` \u5c31\u662f\u5728\u7528\u672c\u5730\u51fd\u6570\u8c03\u7528\u7684\u5f62\u5f0f\u64cd\u4f5c\u8fdc\u7a0b AWS \u670d\u52a1\u3002MCP \u7684\u533a\u522b\u5728\u4e8e\uff0c\u5b83\u8fdb\u4e00\u6b65\u7edf\u4e00\u4e86\u4e0d\u540c\u5de5\u5177\u63d0\u4f9b\u65b9\u4e0e AI \u5e94\u7528\u4e4b\u95f4\u7684\u53d1\u73b0\u548c\u8c03\u7528\u63a5\u53e3\u3002  \u4e0d\u540c\u7684ai\u5230\u5e95\u6709\u4ec0\u4e48\u533a\u522b\uff0c\u201d\u7ed9\u6bcf\u4e2a Agent \u5206\u522b\u7f16\u5199\u4e00\u4e2a AWS CLI \u9002\u914d\u5668\u201c\u5199\u597d\u7684\u9002\u914d\u5668\u4e0d\u80fd\u76f4\u63a5\u590d\u7528\u5417\uff1f","references":["https://py.sdk.modelcontextprotocol.io/get-started/real-host/"],"relations":[{"node":"concept-adapter","label":"API adapter","relation":"explores","direction":"out"},{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"}]},"round-10":{"summary":"Consider a Python agent and a TypeScript agent, each needing AWS S3 and GitHub. There are four possible agent-to-service calling paths in either design. Without a shared convention, each agent may need its own tool registration and invocation bridge for each service, though shared libraries or a REST tool service can reduce that work. With MCP, each host implements or uses an MCP client and each tool provider exposes an MCP server, so the four paths share one protocol. The agents may differ in language, framework, tool registration, result handling, and model interface; they need not differ in model. MCP standardizes the boundary but does not remove all integration code or necessarily reduce its total size.","question":"\u4e3e\u4e00\u4e2a\u4e24\u4e2aagent\u8ddf\u4e24\u4e2a\u670d\u52a1\u4f20\u7edf\u9700\u8981\u56db\u4e2a\u96c6\u6210\u5173\u7cfb\uff0cmcp\u53ea\u9700\u8981\u7edf\u4e00\u7684client\u548cserver\uff0cagent\u7684\u4e0d\u540c\u4f53\u73b0\u5728\u54ea","references":["https://py.sdk.modelcontextprotocol.io/get-started/real-host/"],"relations":[{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"},{"node":"concept-server","label":"MCP server","relation":"explores","direction":"out"}]},"round-11":{"summary":"MCP does not remove language differences, SDKs, transport handling, or the service's adapter to its underlying API. Its distinctive benefit is a publicly shared tool discovery and invocation contract that independently developed hosts and tool providers can both implement. A custom REST tool protocol, gRPC convention, or common registry could deliver the same N-plus-M integration pattern if all parties adopted it. MCP matters mainly because it is an existing common standard in the AI tool ecosystem, not because it makes cross-language work disappear. If one team controls all hosts and services, its existing shared interface may be sufficient.","question":"\u6ca1\u770b\u51fa\u6765\u6709\u4ec0\u4e48\u533a\u522b\uff0c\u4e0d\u5c31\u662f\u8bed\u8a00\u4e0d\u540c\u5e93\u5bf9\u5e94\u7684\u51fd\u6570\u540d\u5b57\u548c\u683c\u5f0f\u4e0d\u540c\u5417\uff0c\u611f\u89c9\u5b9e\u73b0\u4e86mcp\u4e5f\u8981\u5904\u7406\u7c7b\u4f3c\u8bed\u8a00\u95ee\u9898\u554a","references":["https://ts.sdk.modelcontextprotocol.io/v2/","https://spec.openapis.org/oas/latest.html"],"relations":[{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"},{"node":"concept-adapter","label":"API adapter","relation":"explores","direction":"out"},{"node":"concept-api","label":"API","relation":"explores","direction":"out"}]},"round-12":{"summary":"The AWS server exposes `call_aws` as an MCP tool. MCP supplies the shared rules for discovering the tool, describing its inputs, and calling it from a compatible client. The server's AWS integration logic handles the actual AWS operation. This separates the common MCP interface from service-specific work. One short code illustration is `@server.tool(name=\"call_aws\")`.","question":"\u6240\u4ee5\u5728\u521a\u521a\u90a3\u4e2aaws mcp\u91cc\u9762\uff0c\u5b9e\u73b0\u4e86\u54ea\u4e9b\u751f\u6001\u6807\u51c6\uff0c\u7ed9\u4e00\u4e2a\u6bd4\u8f83\u7b80\u5355\u4f46\u91cd\u8981\u7684\u6e90\u7801\u5206\u6790","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/parser/interpretation.py"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"},{"node":"concept-aws_api","label":"AWS API","relation":"explores","direction":"out"}]},"round-13":{"summary":"`suggest_aws_commands` accepts a natural-language description of an AWS task and sends it to a remote AWS recommendation service. The local MCP server returns suggested AWS CLI commands; it does not itself generate the suggestions with a local LLM. The remote service's current internal method is not visible in this repository, so the graph should not claim that it definitely uses or does not use a generative LLM. The agent can use a suggestion to form a command and then call `call_aws` to perform the AWS operation. If the agent already knows the command, it can call `call_aws` directly. This shows that an MCP tool can wrap a search or recommendation service as well as an action.","question":"\u5bf9\u4e8esuggest_aws_commands\uff0c\u5b83\u7684\u8f93\u5165\u662f\u4e00\u4e2a\u81ea\u7136\u8bed\u8a00\u8be2\u95ee\u5417\uff0c\u662f\u901a\u8fc7\u540e\u53f0llm\u8fdb\u884c\u89e3\u6790\u7b54\u590d\u7684\u5417","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/README.md"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-tool_call","label":"Tool call","relation":"explores","direction":"out"}]},"round-14":{"summary":"Yes. An agent can read a REST API description and give a general HTTP tool the URL, method, and arguments; the endpoint need not be hard-coded into an AWS-specific client. MCP also needs connection information for its server, but it gives clients a shared way to list tools, obtain their input schemas, and call them by name. A REST setup can provide similar behavior with OpenAPI and a registry or adapter. The practical difference is where the shared discovery and call conventions are defined, not whether an LLM can understand a REST description.","question":"REST \u7248\u672c\u9700\u8981\u5ba2\u6237\u7aef\u77e5\u9053\u4f60\u5b9a\u4e49\u7684 `/call_aws` \u63a5\u53e3\uff0c\u4e3a\u4ec0\u4e48\uff0c\u4e0d\u80fd\u50cf\u5199description\u8fd9\u6837\u5417","references":["https://spec.openapis.org/oas/latest.html","https://ts.sdk.modelcontextprotocol.io/v2/clients/calling"],"relations":[{"node":"concept-direct","label":"Direct API integration","relation":"explores","direction":"out"},{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"}]},"round-15":{"summary":"AWS CLI and SDKs already simplify AWS API calls, and an agent with documentation search plus a safe CLI or Python executor can often perform the same tasks without MCP. MCP standardizes how independently built AI hosts discover and call tools; it does not inherently make a single AWS operation faster or the model smarter. A prebuilt workflow or one script that performs several steps may reduce repeated model decisions, tool round trips, and context use, but that benefit comes from the workflow or batching and can be built without MCP. The legacy AWS API MCP server mainly adds an MCP entry point and command suggestions. The newer managed AWS MCP server also offers documentation and skill retrieval, sandboxed multi-step execution, and AWS governance features. Its extra value depends on what the agent already has: greater for an agent lacking an AWS executor or for teams needing a common managed interface, smaller for a capable coding agent with safe AWS access. Traditional development already uses standards and wrappers such as AWS SDKs, CLI, and OpenAPI; MCP standardizes a different boundary, between AI hosts and tool providers.","question":"\u6240\u4ee5\u672c\u8d28\u4e0a\u8fd8\u662f\u7edf\u4e00\u4e86api\u534f\u8bae\uff0c\u4e3a\u4ec0\u4e48\u4f20\u7edf\u5f00\u53d1\u4e0d\u7528\u5462\uff0c\u4e3a\u4ec0\u4e48ai\u8fd9\u4e48\u5f3a\u7684\u68c0\u7d22\u80fd\u529b\u53c8\u8981\u591a\u505a\u4e00\u5c42\u540c\u4e00\u5462\uff0c\u662f\u4e3a\u4e86\u52a0\u901f\u54cd\u5e94\u5417\u6bd4\u5982\u628a\u4e00\u4e9b\u56fa\u5b9a\u6d41\u7a0b\u7684\u4e1c\u897f\u63d0\u524d\u5199\u597d\uff0c\u90a3\u4e4b\u524d\u8fd9\u6837\u505a\u4e5f\u80fd\u8282\u7701\u5f00\u53d1\u8005\u7684\u65f6\u95f4\u5427\uff0c\u5404\u79cd\u5c01\u88c5\u5df2\u7ecf\u641e\u5b9a\u4e86\uff0cMCP\u7684\u4f18\u52bf\u5bf9\u6bd4AWS\u76ee\u524d\u73b0\u6709\u7684\u6587\u6863\u548cCLI\u5c01\u88c5\u5230\u5e95\u5728\u54ea","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/MIGRATION.md","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html","https://spec.openapis.org/oas/latest.html"],"relations":[{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"},{"node":"concept-workflow","label":"Workflow","relation":"explores","direction":"out"},{"node":"concept-context","label":"Model context budget","relation":"explores","direction":"out"}]},"round-16":{"summary":"The legacy AWS API MCP server does not turn every AWS operation or private backend step into a separate MCP tool. Its broad `call_aws` tool can invoke many already-public AWS operations; `suggest_aws_commands` recommends commands; the optional `get_execution_plan` gives workflow guidance. More generally, a developer may expose fine-grained tools and let an agent choose their order, or expose a high-level workflow tool whose internal steps remain fixed and hidden. MCP defines how tools are discovered and called; it does not require either level of granularity or transfer workflow control to the agent. An agent can also dynamically combine AWS calls through CLI or SDK access without MCP. The important architecture choice is which decisions the agent makes and which remain in a predefined workflow.","question":"aws\u7684\u8fd9\u4e2amcp\u8fd9\u4e9btool\u90fd\u662f\u4e4b\u524d\u5e38\u7528\u7684api\u5417\u8fd8\u662f\u5f88\u591a\u90fd\u662f\u5185\u90e8\u63a5\u53e3\u4e4b\u524d\u5de5\u4f5c\u6d41\u4e00\u4e2a\u63a5\u53e3\u63a5\u7740\u4e00\u4e2a\u63a5\u53e3\u8fde\u5728\u4e00\u8d77\u5ba2\u6237\u7aef\u53ea\u770b\u5230\u6700\u7ec8\u7684\u8f93\u5165\u8f93\u51fa\uff0c\u73b0\u5728\u901a\u8fc7mcp\u628a\u63a5\u53e3\u66f4\u591a\u7684\u66b4\u9732\u8ba9ai\u81ea\u5df1\u51b3\u5b9a\uff1f","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/README.md","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/MIGRATION.md"],"relations":[{"node":"concept-workflow","label":"Workflow","relation":"explores","direction":"out"},{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"}]},"round-17":{"summary":"`global` is a Python scope declaration, not an enum. `READ_OPERATIONS_INDEX` is a module-level variable that starts empty and is filled when the server starts. It holds a lookup of which AWS operations are read-only; the server uses it when applying security policy to a requested operation. The lookup is an implementation detail of this AWS server, not a feature required by MCP. Keep the one-line phrase `global READ_OPERATIONS_INDEX` only as a label for the source example.","question":"global READ_OPERATIONS_INDEX\u8fd9\u4e9b\u662f\u4ec0\u4e48\u4e1c\u897f\uff0cenum\u5417\uff0c\u4ec0\u4e48\u65f6\u5019\u5b9a\u4e49\u7684\u3001","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/core/metadata/read_only_operations_list.py"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-policy","label":"Security policy","relation":"explores","direction":"out"}]},"round-19":{"summary":"Use the repository as a learning example for two connected topics: how an MCP client discovers and invokes tools, and how an AWS command reaches an AWS operation. A useful sequence is to learn the AWS CLI command shape and read-only queries, follow the `call_aws` path through tool registration, command validation, and AWS integration, then observe a client listing and calling tools. A small personal tool can be a later exercise if useful. The `aws-api-mcp-server` is a legacy implementation, so it is best treated as a study example rather than a recommended new production integration. Keep code examples minimal; the main learning outcome is to distinguish MCP's tool interface from the AWS command and API work behind it.","question":"\u6211\u60f3\u901a\u8fc7\u8fd9\u4e2agit reop\u5b66\u4e60mcp\uff0c\u540c\u65f6\u5b66\u4e60\u4e00\u4e9b\u539f\u6709\u7684aws\u6307\u4ee4","references":["https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/README.md","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/awslabs/aws_api_mcp_server/server.py"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-aws_cli","label":"AWS CLI","relation":"explores","direction":"out"},{"node":"concept-mcp","label":"MCP protocol","relation":"explores","direction":"out"}]},"round-20":{"summary":"The older AWS API MCP server in `awslabs/mcp` has public source that can be inspected and run locally. The newer AWS MCP server is a managed remote service; AWS documents its endpoint and behavior, but does not publish its complete backend implementation in the referenced repositories. The public `aws/agent-toolkit-for-aws` repository contains open-source skills, plugins, configuration, and related tools, rather than the full managed server. For learning implementation, the older server remains a useful source example, while the managed server shows the current AWS product architecture. AWS says the older AWS API MCP server stopped receiving regular development in July 2026 and is scheduled for removal in July 2027.","question":"\u6240\u4ee5\u6700\u65b0\u7684mcp server\u5f00\u6e90\u5417","references":["https://github.com/awslabs/mcp","https://github.com/aws/agent-toolkit-for-aws","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-managed_aws","label":"Managed AWS MCP server","relation":"explores","direction":"out"}]},"round-21":{"summary":"Yes. The Agent Toolkit includes plugins and configuration that connect a compatible agent to the managed AWS MCP server, alongside AWS skills and other public components. The agent's MCP client uses the connection configuration, often through an AWS proxy, to reach the remote server and its tools. The Toolkit repository does not contain the managed server's full backend implementation. Skills and MCP tools can be used together, but a skill is guidance for the agent while an MCP tool provides a callable capability; they are separate mechanisms.","question":"\u6240\u4ee5\u8fd9\u4e2atoolki\u91cc\u9762\u6709mcp","references":["https://github.com/aws/agent-toolkit-for-aws","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html"],"relations":[{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-managed_aws","label":"Managed AWS MCP server","relation":"explores","direction":"out"},{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"}]},"round-22":{"summary":"In `aws-api-mcp-server`, \u201cAPI\u201d refers to access to AWS operations; a server for Elasticsearch similarly exposes tools backed by Elasticsearch capabilities. These are descriptive project names, not naming rules imposed by MCP, and one tool need not map to exactly one underlying API call. An AI host first needs a configured or otherwise known server location. It connects to each server through an MCP client, lists that server's tools, and presents useful tool descriptions to the model. The model chooses a tool for the task, and the host routes the call to the client connected to the right server. A server name by itself does not make the server discoverable on the internet. A single MCP server may also expose tools backed by more than one service. The older standalone Elastic MCP server is now deprecated; Elastic documents a newer Agent Builder MCP endpoint, but the host/client/server pattern remains the same.","question":"api_MCP_server\u8fd9\u91ccapi\u6307\u4ee3\u7684\u662f\u4ec0\u4e48\uff0c\u8fd8\u6709\u5176\u4ed6\u7684\u6bd4\u5982elasticsearch_MPC\u8fd9\u91cc\u6307\u4ee3\u7684\u662felastic\u5bf9\u5e94\u7684api\u5417\uff0ccilent\u662f\u600e\u4e48\u67e5\u8be2\u4e0d\u540c\u7684server\u7684","references":["https://ts.sdk.modelcontextprotocol.io/v2/clients/calling","https://github.com/awslabs/mcp/blob/main/src/aws-api-mcp-server/README.md","https://www.elastic.co/docs/explore-analyze/ai-features/agent-builder/mcp-server"],"relations":[{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"},{"node":"concept-server","label":"MCP server","relation":"explores","direction":"out"}]},"round-23":{"summary":"An MCP host is the AI application. It manages its own MCP connections and the tools available through them, often with one client for each connected server. It can start a local server process, connect to a remote server, present tool definitions to the model, and route a chosen tool call to the right client. It does not manage every server in the MCP ecosystem or necessarily operate the remote server's deployment and internal logic. The server remains responsible for the capability behind its tools. Thus \u201cmanages all servers\u201d means all servers connected to that host, not all MCP servers everywhere.","question":"host\u7ba1\u7406\u6240\u6709server\u5417","references":["https://py.sdk.modelcontextprotocol.io/get-started/first-steps/","https://ts.sdk.modelcontextprotocol.io/v2/serving/stdio"],"relations":[{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"},{"node":"concept-server","label":"MCP server","relation":"explores","direction":"out"}]},"round-24":{"summary":"No separate MCP host is required for an ordinary agent that uses its own functions or tools. If the agent uses MCP servers, the agent application itself plays the host role: it includes or uses MCP clients, connects to selected servers, presents their tools to the model, and routes tool calls. A framework that supports MCP may handle these duties internally. The main setup is the server connections and agent tool flow, not deploying another special host component. If the agent is later deployed as a web service, that running agent application can still be the host.","question":"\u6240\u4ee5\u6b63\u5e38agent\u5f00\u53d1\u4e0b\u6211\u8981\u5148\u914d\u7f6e\u597dhost\u5417","references":["https://py.sdk.modelcontextprotocol.io/get-started/first-steps/"],"relations":[{"node":"concept-agent","label":"AI agent","relation":"explores","direction":"out"},{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"}]},"round-25":{"summary":"Agent Toolkit for AWS is a bundle of plugins, skills, and connection configuration used by an AI host; it is not itself one of the MCP protocol roles. The host runs the agent and its MCP client. Toolkit skills guide the agent, while Toolkit configuration tells the host how to connect to AWS's managed MCP server, commonly through an AWS proxy. The managed server exposes AWS tools and calls AWS services. The MCP client belongs to the host or its framework, not to the Toolkit package. Skills and the MCP connection can also be used separately. This distinction makes the Toolkit a practical example of packaging guidance and tool access for an existing agent.","question":"\u90a3\n\n# Agent Toolkit\u5728\u54ea\u4e2a\u4f4d\u7f6e","references":["https://github.com/aws/agent-toolkit-for-aws","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html"],"relations":[{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"}]},"round-26":{"summary":"The AWS MCP Server in that documentation is the actual AWS-managed remote MCP service. It exposes the tools and performs the AWS-side work. The optional local MCP Proxy is a connection component: with SigV4, it signs and forwards requests from the agent's MCP client to the remote service. An OAuth-capable client can connect directly without that local proxy. The Toolkit's connection configuration may launch the proxy, but it does not install or run the managed backend locally. A local proxy can look like a server to the host because it receives MCP requests, yet it is distinct from AWS's managed server.","question":"## Components\n\nThe Agent Toolkit for AWS includes four components that work together:\n\n- **AWS MCP Server** \u2013 A managed server that gives agents access to AWS through the Model Context Protocol (MCP)\u8fd9\u91cc\u8bf4\u7684server\u662f\u771f\u7684\u540e\u7aefserver\u8fd8\u662f\u53ea\u662fproxy","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/oauth-authentication.html"],"relations":[{"node":"concept-managed_aws","label":"Managed AWS MCP server","relation":"explores","direction":"out"},{"node":"concept-proxy","label":"AWS MCP proxy","relation":"explores","direction":"out"},{"node":"concept-oauth","label":"OAuth direct connection","relation":"explores","direction":"out"}]},"round-27":{"summary":"Plugins are installed into a supported agent environment and typically bundle MCP connection configuration with a set of skills. Rules files are usually placed in the local project or agent configuration and guide the agent's behavior. Skills may be installed locally through a plugin or separately, but AWS also supports discovering and loading skills from the managed MCP server at runtime, so they are not always deployed locally. These are guidance and configuration resources, not three separate running backend services. The AWS MCP server itself remains AWS-managed and remote; installing a plugin does not download that backend.","question":"**AWS MCP Server**  **Agent skills**  **Plugins**  **Rules files**  \u6240\u4ee5\u540e\u4e09\u8005\u901a\u8fc7toolkit\u90e8\u7f72\u5728\u672c\u5730\uff1f","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/components.html","https://github.com/aws/agent-toolkit-for-aws/blob/main/skills/README.md","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/rules-files.html"],"relations":[{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"},{"node":"concept-rules","label":"Rules file","relation":"explores","direction":"out"}]},"round-29":{"summary":"\u201cAgent Toolkit for AWS\u201d names AWS's overall product offering, not just the files in its public GitHub repository. AWS lists the managed MCP server, skills, plugins, and rules files as parts of that offering. The server runs in AWS's cloud and supplies callable capabilities. The repository distributes integration materials such as skills, plugins, and rules; a plugin can configure an agent to connect to the server without installing the server backend. Thus \u201cpart of the Toolkit\u201d is a product relationship, not a claim that the server's code lives in or is downloaded from the repository. A useful analogy is a product that includes both a local client and a cloud service: the service belongs to the product even when its backend code is absent from the client repository.","question":"\u90a3\u4e3a\u4ec0\u4e48\u8bf4server\u662fAgent Toolkit for AWS\u7684\u4e00\u90e8\u5206","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/components.html","https://github.com/aws/agent-toolkit-for-aws"],"relations":[{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-managed_aws","label":"Managed AWS MCP server","relation":"explores","direction":"out"}]},"round-30":{"summary":"The public `aws/agent-toolkit-for-aws` repository contains plugins, skills, and rules files that can be read and downloaded. They are not merely inaccessible internal AWS components. Cloning the repository gives you the files for study, but does not automatically install or activate them in an agent. A plugin manager can install a plugin, skills can be installed separately or loaded on demand from the managed MCP server, and rules are placed in the agent's project configuration. The managed AWS MCP server is different: its full backend implementation is not in that repository. For learning, inspect one plugin's MCP connection configuration alongside one skill and one rules file; these show how the local guidance connects to the remote tool service.","question":"\u90a3\u5176\u4ed6\u90e8\u5206\u6211\u4e0b\u8f7d\u5c31\u662f\u76f4\u63a5\u628agit\u4ed3\u5e93\u7684\u90a3\u4e2a\u4e0b\u8f7d\u5417\u8fd8\u662f\u4ed6\u4eec\u5185\u90e8\u7684","references":["https://github.com/aws/agent-toolkit-for-aws","https://github.com/aws/agent-toolkit-for-aws/blob/main/skills/README.md","https://docs.aws.amazon.com/agent-toolkit/latest/userguide/rules-files.html"],"relations":[{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"}]},"round-31":{"summary":"Adding `aws/agent-toolkit-for-aws` makes that GitHub repository a marketplace source for Codex. It does not mean AWS was already in a built-in catalog. Adding the source, installing a selected plugin, and connecting its MCP server are distinct steps.","question":"```\ncodex plugin marketplace add aws/agent-toolkit-for-aws\u8fd9\u91cc\u610f\u601d\u5c31\u662f\u8fd9\u4e2a\u4ed3\u5e93\u5df2\u7ecf\u6ce8\u518c\u5728codex\u7684plugin\u5e93\u91cc\u9762\u4e86\uff1f\n```","references":["https://developers.openai.com/plugins/build/plugins","https://github.com/aws/agent-toolkit-for-aws"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"}]},"round-32":{"summary":"The Codex marketplace command accepts an `owner/repo` source as GitHub shorthand, as well as full Git URLs and local paths. The command parser recognizes that syntax; it is not a guess made by the LLM. The repository then supplies its marketplace catalog.","question":"\u600e\u4e48\u77e5\u9053\u8fd9\u662f\u4e2agithub link","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-loader","label":"Plugin loader","relation":"explores","direction":"out"}]},"round-33":{"summary":"For a repository used as a plugin marketplace, a marketplace manifest catalogs plugin names and their locations. Codex obtains the marketplace source, reads the catalog, and then installs a selected plugin from the indicated path. The catalog is not the plugin itself, and merely adding the marketplace is not the same as installing every plugin.","question":"\u6240\u4ee5\u8fd9\u7c7b\u4e0b\u8f7d\u65b9\u5f0f\u4ed3\u5e93\u90fd\u4f1a\u6807\u6ce8marketplace\u6587\u4ef6\uff0c\u800c\u4e0b\u8f7d\u903b\u8f91\u5c31\u662f\u53bb\u627e\u8fd9\u4e2a\u6587\u4ef6","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"}]},"round-34":{"summary":"`marketplace` is a CLI subcommand category under `plugin`; `add` is the action; the repository identifier is the source argument. The word `marketplace` in the command is separate from any `marketplace.json` file in a repository.","question":"```\nmarketplace\u8fd9\u91cc\u662f\u4e2a\u53c2\u6570\u5417\uff0c\u8868\u793a\u7684\u662f\u64cd\u4f5c\u8fd8\u662f\u8def\u5f84\n```","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-loader","label":"Plugin loader","relation":"explores","direction":"out"}]},"round-35":{"summary":"Only repositories that use a particular marketplace distribution format need that format\u2019s marketplace catalog. A plugin can have its own manifest without the repository being a marketplace, and other agent platforms may use other catalogs. `marketplace.json` describes a collection; `plugin.json` describes one plugin. Neither filename is a universal rule for every public GitHub repository.","question":"\u6240\u4ee5\u5927\u5bb6\u90fd\u7ea6\u5b9a\u516c\u5f00\u7684\u8fd9\u79cd\u63d2\u4ef6\u90fd\u4f1a\u6709\u4e00\u4e2amarketplace\u6587\u4ef6","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"}]},"round-36":{"summary":"AWS includes platform-specific marketplace metadata to distribute the Toolkit through several agent ecosystems. A new plugin only needs to support the platforms its author chooses. The differences are plugin packaging and loader conventions, not the programming language of the MCP server; skills and connection definitions can often be shared.","question":"\u6240\u4ee5\u73b0\u5728\u5199\u4e00\u4e2a\u5f00\u6e90\u63d2\u4ef6\u8981\u8d77\u7801\u652f\u6301[.agents/plugins](https://github.com/aws/agent-toolkit-for-aws/tree/main/.agents/plugins \"This path skips through empty directories\")  [.claude-plugin](https://github.com/aws/agent-toolkit-for-aws/tree/main/.claude-plugin \".claude-plugin\")  [.cursor-plugin](https://github.com/aws/agent-toolkit-for-aws/tree/main/.cursor-plugin \".cursor-plugin\")  \u56e0\u4e3a\u4e0d\u540cagent\u8def\u5f84\u4e0d\u4e00\u6837\uff1f","references":["https://github.com/aws/agent-toolkit-for-aws","https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-marketplace","label":"Plugin marketplace","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-37":{"summary":"A broad AWS API tool covers many AWS control-plane operations, while a specialized server can offer focused tools for a service\u2019s own data and workflows. For example, OpenSearch queries differ from managing an OpenSearch domain; ElastiCache is a cache service and should not be confused with Elasticsearch. Agents connect only to the servers needed for their tasks.","question":"\u6240\u4ee5aws\u8fd9\u91cc\u4e3a\u4ec0\u4e48\u8981\u52a0\u5165\u5176\u4ed6server\u60f3elastic search","references":["https://github.com/awslabs/mcp"],"relations":[{"node":"concept-legacy_aws","label":"Legacy AWS API MCP server","relation":"explores","direction":"out"},{"node":"concept-server","label":"MCP server","relation":"explores","direction":"out"},{"node":"concept-aws_api","label":"AWS API","relation":"explores","direction":"out"}]},"round-38":{"summary":"The AWS Labs PostgreSQL MCP server is a specialized integration for Aurora PostgreSQL and RDS for PostgreSQL. It can connect through PostgreSQL wire protocols, and Aurora can also use the RDS Data API when enabled. That reaches database queries and schema work, whereas a broad AWS API server mainly manages AWS resources. Connection method and permissions shape what the tool can do.","question":"src/postgres-mcp-server\u8fd9\u4e2a\u5462","references":["https://github.com/awslabs/mcp/blob/main/src/postgres-mcp-server/README.md"],"relations":[{"node":"concept-postgres","label":"PostgreSQL MCP server","relation":"explores","direction":"out"},{"node":"concept-aws_api","label":"AWS API","relation":"explores","direction":"out"}]},"round-39":{"summary":"Compaction condenses a long conversation into a shorter working context so the agent can continue with key facts. It can reduce context pressure, but important goals and corrections still need to be preserved. This exchange is a context-management concept, not part of MCP protocol behavior.","question":"/compact","references":[],"relations":[{"node":"concept-context","label":"Model context budget","relation":"explores","direction":"out"},{"node":"concept-agent","label":"AI agent","relation":"explores","direction":"out"}]},"round-40":{"summary":"There are two separate possible paths, not one automatic chain. A host using AWS Agent Toolkit may reach an Aurora database through the managed AWS MCP server and RDS Data API when that API is enabled. Alternatively, it can connect to the AWS Labs PostgreSQL MCP server, which has database-specific tools and can use a PostgreSQL connection or the Data API. In both paths, the host selects a tool and returns query results to the model; the Toolkit repository shows setup and skills, while the PostgreSQL server repository shows the database-tool implementation.","question":"\u7ed3\u5408toolkit\u548cmcp\uff0c\u7ed9\u6211\u6307\u51fa\u6211\u5982\u679c\u8c03\u7528ai\u6267\u884c\u4e00\u4e2aaws\u4e0a\u8fd0\u884c\u7684postgre database\u7684\u67e5\u8be2\uff0c\u6d89\u53ca\u54ea\u4e9b\u6d41\u7a0b\uff0c\u8ddfgit\u4ed3\u5e93\u7684\u54ea\u4e9b\u6587\u4ef6\u76f8\u5173","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/mcp-server.html","https://github.com/awslabs/mcp/blob/main/src/postgres-mcp-server/README.md"],"relations":[{"node":"concept-postgres","label":"PostgreSQL MCP server","relation":"explores","direction":"out"},{"node":"concept-toolkit","label":"Agent Toolkit for AWS","relation":"explores","direction":"out"},{"node":"concept-data_api","label":"RDS Data API","relation":"explores","direction":"out"}]},"round-41":{"summary":"In the proxy-based path, `uv`/`uvx` runs the local MCP proxy; AWS credentials identify the caller and authorize account operations through SigV4. Documentation search may work without account credentials. An OAuth direct connection is another supported path and does not require the local proxy or `uv`, so the prerequisites depend on the chosen connection method.","question":"Pick your agent. Run the commands. Every path needs two prerequisites, called out below.\u00a0\n\n\n\nPrerequisites (all agents):\\\n\n\n1. [uv](https://docs.astral.sh/uv/) installed (runs the MCP proxy).\n2. [AWS credentials](https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html)\u00a0(optional). Only for API calls, not docs search.\u4e3a\u4ec0\u4e48\u9700\u8981\u8fd9\u4e24\u4e2a","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html"],"relations":[{"node":"concept-proxy","label":"AWS MCP proxy","relation":"explores","direction":"out"},{"node":"concept-sigv4","label":"SigV4 proxy connection","relation":"explores","direction":"out"},{"node":"concept-oauth","label":"OAuth direct connection","relation":"explores","direction":"out"}]},"round-42":{"summary":"Check the agent\u2019s MCP client documentation for remote transport support and for the authentication method required by the server. Streamable HTTP support alone does not imply OAuth support. A local-process-only client can use a compatible proxy, while an OAuth-capable remote client can connect directly to AWS\u2019s managed endpoint.","question":"\u600e\u4e48\u77e5\u9053\u652f\u4e0d\u652f\u6301\u8fdc\u7a0b\u5462","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/oauth-authentication.html"],"relations":[{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"},{"node":"concept-oauth","label":"OAuth direct connection","relation":"explores","direction":"out"},{"node":"concept-proxy","label":"AWS MCP proxy","relation":"explores","direction":"out"}]},"round-43":{"summary":"OAuth direct connection avoids a local proxy and usually simplifies single-account setup; SigV4 through a local proxy uses AWS profiles or credentials and can support explicit multi-account control. Both rely on AWS IAM authorization, and both involve sensitive credentials or tokens. The practical choice depends on client support, account-switching needs, and how credentials are managed; neither path is automatically safer in every situation.","question":"\u8fd9\u4e24\u79cd\u8fde\u63a5\u65b9\u5f0f\u4ece\u5b89\u5168\u6027\u548c\u65b9\u4fbf\u6027\u7684\u89d2\u5ea6\u6709\u4ec0\u4e48\u533a\u522b","references":["https://docs.aws.amazon.com/agent-toolkit/latest/userguide/getting-started-aws-mcp-server.html"],"relations":[{"node":"concept-oauth","label":"OAuth direct connection","relation":"explores","direction":"out"},{"node":"concept-sigv4","label":"SigV4 proxy connection","relation":"explores","direction":"out"},{"node":"concept-proxy","label":"AWS MCP proxy","relation":"explores","direction":"out"}]},"round-44":{"summary":"Plugin loaders, not LLMs, read agreed manifest and component locations. A marketplace catalog points to plugin folders; the plugin format tells the loader where its manifest, skills, and MCP configuration live. The host then configures MCP clients and presents discovered tools to the model. File paths are packaging conventions, while MCP tool discovery happens after a server connection.","question":"`plugin.json`  \u548cmcp.jsonagent\u662f\u600e\u4e48\u77e5\u9053\u8981\u5148\u8bfb\u53d6\u8fd9\u4e9b\u7684\uff0c\u54ea\u91cc\u6709\u8def\u5f84\u8868\u660e\u8fd8\u662f\u4ec0\u4e48\u7ea6\u5b9a\u4fd7\u6210\u7684\uff1f","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-loader","label":"Plugin loader","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"}]},"round-45":{"summary":"Start with the target agent\u2019s official plugin documentation and schema. A portable Agent Plugins package uses agreed root files and component directories; platform-specific formats may use different paths. Choose a target platform or portable format, follow its documented layout, and validate against its schema rather than copying an arbitrary repository.","question":"\u8fd9\u4e9b\u7ea6\u5b9a\u7684\u8def\u5f84\u4f4d\u7f6e\u6211\u8be5\u600e\u4e48\u77e5\u9053\u5f53\u6211\u8981\u5f00\u53d1\u7684\u9002\u5408","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-46":{"summary":"A plugin format defines which manifest fields are valid and how a loader interprets them. AWS\u2019s Codex compatibility manifest can point to skills and MCP configuration, while the portable format finds `skills/` and `mcp.json` at standard root locations instead of using those same path fields. The developer should check both the schema and loader documentation for the chosen format.","question":"\u8fd9\u4e9bplugin.json\u7684\u5b57\u6bb5\u662f\u56fa\u5b9a\u7684\u5417\u6bd4\u5982skill mcpServers\uff0c\u5f00\u53d1\u7684\u65f6\u5019\u600e\u4e48\u77e5\u9053\u5199\u4ec0\u4e48","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-loader","label":"Plugin loader","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-47":{"summary":"Platforms can have their own plugin formats, but platforms supporting a common portable format can share its schema. A plugin normally references the published schema with `$schema`; it need not copy the schema file into the repository. The manifest and package contents still must follow the loader\u2019s supported version and conventions.","question":"\u8fd9\u4e2aschema\u662f\u6839\u636e\u4e0d\u540c\u7684agent\u5e73\u53f0\u4f7f\u7528\u4e0d\u540c\u7684\u5417\u4ee5\u53ca\u81ea\u5df1\u7684\u4ed3\u5e93\u9700\u8981\u653e\u4e00\u4e2a\u8fd9\u6837\u7684schema\u6587\u4ef6\u5417","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-48":{"summary":"AWS uses a supported Codex compatibility layout with a manifest under `.codex-plugin/` and references to `.mcp.json` and skills. The portable format instead uses root `plugin.json`, optional root `mcp.json`, and `skills/`, with a schema reference in the portable manifest. The layouts represent different package formats; the AWS compatibility manifest does not become the portable manifest merely by changing its filename.","question":"\u6211\u521a\u521a\u770b\u4e86openai \u7684plugin\u5f00\u53d1\u597d\u50cfaws-core/plugin.json\u5c31\u53ef\u4ee5\u4e86\u4e3a\u4ec0\u4e48\u8fd8\u6709.codex-plugin\u8fd9\u4e2a\u6587\u4ef6\u4ee5\u53ca\u91cc\u9762\u7684json\u6ca1\u6709\u5e26schema\u5b57\u6bb5","references":["https://developers.openai.com/plugins/build/plugins","https://github.com/aws/agent-toolkit-for-aws"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-49":{"summary":"The portable format discovers optional components at fixed locations: skills in `skills/` and MCP configuration in `mcp.json`. Its root `plugin.json` carries plugin identity and metadata, so the older compatibility path fields are unnecessary. Absence of an optional component simply means that plugin does not bundle it.","question":"\u4f46\u662f\u8fd9\u4e2a\u65b0\u7684\u63d2\u4ef6\u89c4\u8303\u597d\u50cf\u6ca1\u6709skill\u548cmcpserver\u5b57\u6bb5\uff1f","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"},{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"}]},"round-50":{"summary":"OpenAI-specific presentation metadata can live under `extensions.com.openai.interface` in a portable manifest, or in a supported compatibility manifest. `defaultPrompt` provides suggested prompts in the interface; it is not an instruction automatically attached to every agent request. Its role is user-facing onboarding, separate from the skill\u2019s task guidance and the MCP tool\u2019s callable schema.","question":"\u90a3\u65e7\u7248\u7684\"interface\": {\n    \"displayName\": \"AWS Core\",\n    \"shortDescription\": \"AWS agent plugin with skills and MCP servers\",\n    \"longDescription\": \"Build, deploy, and operate applications on AWS. Skills to author infrastructure-as-code (CDK, CloudFormation), use core services (Lambda, API Gateway, Step Functions, ECS/Fargate, ECR, IAM, Amazon Bedrock with Knowledge Bases and Guardrails, AWS Blocks), and complete common tasks across observability (CloudWatch, X-Ray, CloudTrail, ADOT), messaging and streaming (SQS, SNS, EventBridge, Kinesis, MSK), AWS SDKs (boto3, JS v3, Swift), and cost optimization, including OpenSearch Serverless vector stores for Knowledge Bases.\",\n    \"defaultPrompt\": [\n      \"Scaffold a CDK stack for this app.\",\n      \"Add IAM least-privilege policies for these resources.\",\n      \"Wire up CloudWatch logs and alarms for this service.\"\n    ],\n    \"developerName\": \"Amazon Web Services\",\n    \"category\": \"Cloud\",\n    \"capabilities\": [\n      \"Read\",\n      \"Write\"\n    ],\n    \"websiteURL\": \"https://github.com/aws/agent-toolkit-for-aws\",\n    \"privacyPolicyURL\": \"https://aws.amazon.com/privacy/\",\n    \"termsOfServiceURL\": \"https://aws.amazon.com/service-terms/\",\n    \"brandColor\": \"#FF9900\"\n  },\u53bb\u54ea\u4e86\uff0c\u4ee5\u53ca\u91cc\u9762\u8fd9\u4e2adefaultprompt\u610f\u601d\u662fagent\u6267\u884c\u65f6\u8fd9\u90e8\u5206\u90fd\u8ddf\u968f\u7528\u6237\u8f93\u5165\u4e00\u8d77\u5417\uff1f","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-agent","label":"AI agent","relation":"explores","direction":"out"}]},"round-51":{"summary":"The portable schema has a general `extensions` area for platform-specific metadata, so the generic schema need not enumerate each vendor key. OpenAI documents `com.openai` as its own extension within that area. A portable plugin can keep common identity at the root and place OpenAI-specific interface settings under the extension.","question":"`extensions.com.openai`  **\u5728\u65b0\u7248\u6ca1\u627e\u5230**","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-53":{"summary":"OpenAI\u2019s documented fallback applies to OpenAI-specific settings: when the portable root manifest has an `extensions.com.openai` object, that object supplies those settings and the compatibility overlay is not merged; when it is absent, Codex can read `.codex-plugin/plugin.json` for them. The portable root identity and components remain canonical. This is a loader precedence rule, not a runtime MCP request flow.","question":"\u90a3\u8fd9\u4e2a\u4ed3\u5e93codex plugin loader\u8bfb\u65b0\u7248\u540e\u4f1a\u8dd1\u53bb\u65e7\u7248\u8bfbextension\u5417","references":["https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-loader","label":"Plugin loader","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"},{"node":"concept-portable","label":"Portable plugin format","relation":"explores","direction":"out"}]},"round-54":{"summary":"An agent can use a skill\u2019s name and short description to decide whether to load its full instructions for a database task. A skill supplies guidance and workflow knowledge; an MCP tool description supplies the callable capability and input schema. A skill may tell the agent when or how to use several tools, and a tool may be useful across several skills, so the relationship is not one-to-one. Loading relevant skills on demand can reduce context use.","question":"agent\u600e\u4e48\u77e5\u9053\u5f53\u6211\u67e5\u8be2\u6570\u636e\u5e93\u7684\u65f6\u5019\u9700\u8981\u53bbaws-database\u91cc\u9762\u8bfbskill.md\uff0c\u4ee5\u53ca\u8fd9\u91cc\u7684skill\u662f\u5bf9\u5e94mcp tool\u7684\u8bf4\u660e\u5417","references":["https://github.com/aws/agent-toolkit-for-aws/blob/main/skills/README.md","https://developers.openai.com/plugins/build/plugins"],"relations":[{"node":"concept-skill","label":"Agent skill","relation":"explores","direction":"out"},{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-context","label":"Model context budget","relation":"explores","direction":"out"}]},"round-55":{"summary":"No. JSON is a data format; a JSON file is persistent storage, while a JSON message is transmitted directly between processes or over a network. MCP tool calls commonly use structured protocol messages without creating a new disk file for every request. Configuration files such as `plugin.json` are separate from these runtime messages.","question":"\u6bcf\u4e00\u6b21agent\u7684\u8bf7\u6c42\u90fd\u662f\u751f\u6210\u4e00\u4e2ajson\u6587\u4ef6\u8fdb\u884c\u4fe1\u606f\u4f20\u9012\u5417","references":["https://modelcontextprotocol.io/specification/2025-11-25/basic/transports"],"relations":[{"node":"concept-json_message","label":"JSON protocol message","relation":"explores","direction":"out"},{"node":"concept-tool_call","label":"Tool call","relation":"explores","direction":"out"},{"node":"concept-manifest","label":"Plugin manifest","relation":"explores","direction":"out"}]},"round-56":{"summary":"A connected MCP client may call `tools/list` to obtain names, descriptions, and input schemas. The host presents relevant tool definitions to the LLM; the LLM decides whether to call a tool and emits its name and structured arguments. The host validates or routes that choice, sends `tools/call` through the client, receives the result, and returns it to the LLM for the final answer. The LLM does not itself send `tools/list`, and the host can cache or refresh the list rather than repeating it before every user message.","question":"LLM \u4ea7\u751f Tool Call\u8be6\u7ec6\u8bb2\u4e00\u4e0b\uff0c\u53e6\u5916\u5728\u8fd9\u4e2a\u9636\u6bb5\u4e4b\u524d\u662f\u4e0d\u662f\u8981\u6267\u884c\u4e00\u4e2atool/list\u7684\u9605\u8bfb","references":["https://ts.sdk.modelcontextprotocol.io/v2/clients/calling"],"relations":[{"node":"concept-tool_call","label":"Tool call","relation":"explores","direction":"out"},{"node":"concept-tool_definition","label":"Tool definition","relation":"explores","direction":"out"},{"node":"concept-client","label":"MCP client","relation":"explores","direction":"out"},{"node":"concept-host","label":"MCP host","relation":"explores","direction":"out"}]}};
const graphifyShowInfo = showInfo;
showInfo = function (nodeId) {
  graphifyShowInfo(nodeId);
  const data = AI_DETAILS[nodeId];
  if (!data) return;
  const panel = document.getElementById('info-content');
  const detail = document.createElement('section');
  detail.className = 'ai-detail';
  function addText(label, value) {
    if (!value) return;
    const heading = document.createElement('h4');
    heading.textContent = label;
    const paragraph = document.createElement('p');
    paragraph.textContent = value;
    detail.append(heading, paragraph);
  }
  addText('Original question', data.question);
  addText('Learning note', data.summary);
  if (data.relations && data.relations.length) {
    const heading = document.createElement('h4');
    heading.textContent = 'Relations';
    detail.append(heading);
    data.relations.forEach(item => {
      const link = document.createElement('span');
      link.className = 'neighbor-link';
      link.dataset.nid = item.node;
      link.textContent = item.direction === 'out'
        ? `${item.relation} → ${item.label}`
        : `${item.label} → ${item.relation}`;
      detail.append(link);
    });
  }
  if (data.references && data.references.length) {
    const heading = document.createElement('h4');
    heading.textContent = 'References';
    detail.append(heading);
    data.references.forEach((url, index) => {
      if (!url.startsWith('https://')) return;
      const link = document.createElement('a');
      link.href = url;
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      link.textContent = `Source ${index + 1}`;
      detail.append(link);
    });
  }
  const first = panel.querySelector('.field');
  if (first) first.after(detail); else panel.prepend(detail);
};

aiBackButton.type = 'button';
aiBackButton.textContent = '← Back';
aiBackButton.title = 'Return to the previous relationship view';
aiBackButton.setAttribute('aria-label', 'Back to previous relationship view');
const aiForwardButton = document.createElement('button');
aiForwardButton.type = 'button';
aiForwardButton.textContent = 'Forward →';
aiForwardButton.title = 'Return to the next relationship view';
aiForwardButton.setAttribute('aria-label', 'Forward to next relationship view');
aiHistoryControls.append(aiBackButton, aiForwardButton);
aiViewWrap.append(aiViewLabel, aiViewSelect, aiHistoryControls, aiViewHint);
aiSidebar.insertBefore(aiViewWrap, document.getElementById('search-wrap'));

const aiQuestionWrap = document.createElement('div');
aiQuestionWrap.id = 'ai-question-wrap';
const aiQuestionHeading = document.createElement('h3');
aiQuestionHeading.textContent = 'Questions';
const aiQuestionList = document.createElement('div');
aiQuestionList.id = 'ai-question-list';
aiQuestionWrap.append(aiQuestionHeading, aiQuestionList);
aiSidebar.insertBefore(aiQuestionWrap, document.getElementById('legend-wrap'));

network.setOptions({ physics: { enabled: false }, edges: { smooth: false } });
let aiCurrentChapter = null;
let aiCurrentQuestion = null;
let aiCurrentNode = null;
const aiBackStack = [];
const aiForwardStack = [];

function aiCaptureState() {
  return {
    chapterId: aiCurrentChapter,
    questionId: aiCurrentQuestion,
    nodeId: aiCurrentNode,
    position: network.getViewPosition(),
    scale: network.getScale(),
    questionListScrollTop: aiQuestionWrap.scrollTop,
    infoScrollTop: document.getElementById('info-panel').scrollTop,
  };
}

function aiUpdateHistoryButtons() {
  aiBackButton.disabled = aiBackStack.length === 0;
  aiForwardButton.disabled = aiForwardStack.length === 0;
}

function aiRenderQuestionList() {
  aiQuestionList.replaceChildren();
  if (aiCurrentChapter === null) {
    const note = document.createElement('p');
    note.className = 'ai-question-empty';
    note.textContent = 'Choose a chapter to browse its questions.';
    aiQuestionList.append(note);
    return;
  }
  RAW_NODES.filter(node => node.id.startsWith('round-') && node.community === aiCurrentChapter)
    .forEach(node => {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'ai-question';
      button.textContent = node.label;
      button.title = AI_DETAILS[node.id].question;
      if (node.id === aiCurrentQuestion) button.setAttribute('aria-current', 'true');
      button.addEventListener('click', () => aiShowNode(node.id));
      aiQuestionList.append(button);
    });
}

function aiShowView(chapterId = null, questionId = null) {
  aiCurrentChapter = chapterId;
  aiCurrentQuestion = questionId;
  aiViewSelect.value = chapterId === null ? 'overview' : String(chapterId);
  aiRenderQuestionList();
  const positions = new Map();
  const visible = new Set();
  if (chapterId === null) {
    AI_OVERVIEW_CONCEPTS.forEach((concepts, index) => {
      const x = (index % 3 - 1) * 440;
      const y = Math.floor(index / 3) * 420 - 240;
      positions.set(`chapter-${index}`, { x, y });
      visible.add(`chapter-${index}`);
      concepts.forEach((id, offset) => {
        visible.add(id);
        positions.set(id, { x: x + (offset ? 115 : -115), y: y + 130 });
      });
    });
  } else if (questionId) {
    const concepts = RAW_EDGES.filter(edge => edge.from === questionId && edge.label === 'explores')
      .map(edge => edge.to);
    visible.add(`chapter-${chapterId}`);
    visible.add(questionId);
    positions.set(`chapter-${chapterId}`, { x: 0, y: -250 });
    positions.set(questionId, { x: 0, y: 240 });
    concepts.forEach((id, index) => {
      visible.add(id);
      positions.set(id, { x: (index - (concepts.length - 1) / 2) * 210, y: 0 });
    });
  } else {
    visible.add(`chapter-${chapterId}`);
    positions.set(`chapter-${chapterId}`, { x: 0, y: -300 });
    const concepts = AI_ALL_NODES.filter(node => node.id.startsWith('concept-') && node.community === chapterId);
    concepts.forEach((node, index) => {
      visible.add(node.id);
      const columns = Math.min(4, concepts.length);
      positions.set(node.id, {
        x: (index % columns - (columns - 1) / 2) * 250,
        y: Math.floor(index / columns) * 180 - 60,
      });
    });
  }
  const color = getComputedStyle(document.documentElement).getPropertyValue('--node-label').trim();
  const shownNodes = [...visible].map(id => {
    const node = AI_NODE_BY_ID.get(id);
    return {
      ...node,
      ...positions.get(id),
      label: id.startsWith('round-') ? 'Question' : node.label,
      font: { ...node.font, color, size: questionId ? 18 : node.font.size },
    };
  });
  const shownEdges = AI_ALL_EDGES.filter(edge => visible.has(edge.from) && visible.has(edge.to))
    .filter(edge => {
      if (questionId) {
        return edge.from === questionId ||
          (edge.from === `chapter-${chapterId}` && edge.to === questionId);
      }
      if (edge.from.startsWith('round-')) return edge.from === questionId;
      if (edge.from.startsWith('chapter-')) {
        return chapterId === null || edge.from === `chapter-${chapterId}`;
      }
      return true;
    });
  edgesDS.clear();
  nodesDS.clear();
  nodesDS.add(shownNodes);
  edgesDS.add(shownEdges);
  document.getElementById('stats').textContent = `${shownNodes.length} ideas · ${shownEdges.length} visible relations`;
  network.fit({ animation: false });
  network.moveTo({ scale: network.getScale() * 0.85, animation: false });
  if (!questionId) {
    document.getElementById('info-content').innerHTML =
      '<span class="empty">Select a node or choose a question to read its learning note.</span>';
  }
}

function aiPresentNode(nodeId) {
  if (nodeId && nodesDS.get(nodeId)) {
    network.selectNodes([nodeId]);
    showInfo(nodeId);
  } else {
    network.unselectAll();
    document.getElementById('info-content').innerHTML =
      '<span class="empty">Select a node or choose a question to read its learning note.</span>';
  }
}

function aiNavigate(chapterId, questionId = null, nodeId = null) {
  const sameView = chapterId === aiCurrentChapter && questionId === aiCurrentQuestion;
  if (sameView && nodeId === aiCurrentNode) return;
  aiBackStack.push(aiCaptureState());
  if (aiBackStack.length > 50) aiBackStack.shift();
  aiForwardStack.length = 0;
  if (!sameView) aiShowView(chapterId, questionId);
  aiCurrentNode = nodeId;
  aiPresentNode(nodeId);
  aiUpdateHistoryButtons();
}

function aiRestoreState(state) {
  aiShowView(state.chapterId, state.questionId);
  aiCurrentNode = state.nodeId;
  aiPresentNode(state.nodeId);
  aiQuestionWrap.scrollTop = state.questionListScrollTop;
  document.getElementById('info-panel').scrollTop = state.infoScrollTop;
  network.moveTo({
    position: state.position,
    scale: state.scale,
    animation: false,
  });
  aiUpdateHistoryButtons();
}

aiBackButton.addEventListener('click', () => {
  if (!aiBackStack.length) return;
  aiForwardStack.push(aiCaptureState());
  aiRestoreState(aiBackStack.pop());
});
aiForwardButton.addEventListener('click', () => {
  if (!aiForwardStack.length) return;
  aiBackStack.push(aiCaptureState());
  aiRestoreState(aiForwardStack.pop());
});

function aiShowNode(nodeId) {
  const node = AI_NODE_BY_ID.get(nodeId);
  if (!node) return;
  if (nodeId.startsWith('chapter-')) aiNavigate(node.community, null, nodeId);
  else if (nodeId.startsWith('round-')) aiNavigate(node.community, nodeId, nodeId);
  else if (aiCurrentChapter !== node.community || aiCurrentQuestion)
    aiNavigate(node.community, null, nodeId);
  else aiNavigate(aiCurrentChapter, null, nodeId);
}
focusNode = aiShowNode;
network.on('click', params => {
  const nodeId = params.nodes[0];
  if (nodeId) aiShowNode(nodeId);
  else aiCurrentNode = null;
});
aiViewSelect.addEventListener('change', () => {
  const value = aiViewSelect.value;
  aiNavigate(value === 'overview' ? null : Number(value));
});
// Graphify searches every node, including nodes hidden in the current view.
searchInput.addEventListener('input', () => {
  searchResults.querySelectorAll('.search-item').forEach(item => {
    const node = RAW_NODES.find(candidate => candidate.label === item.textContent);
    if (!node) return;
    item.onclick = () => {
      aiShowNode(node.id);
      searchResults.style.display = 'none';
      searchInput.value = '';
    };
  });
});
aiShowView();
aiUpdateHistoryButtons();
window.addEventListener('message', event => {
  if (event.origin !== location.origin || !event.data || event.data.type !== 'ai-graph-view') return;
  const chapterId = event.data.chapterId;
  if (chapterId === null) aiNavigate(null);
  else if (Number.isInteger(chapterId) && chapterId >= 0 && chapterId < LEGEND.length) aiNavigate(chapterId);
});
</script>
</body>
</html>
